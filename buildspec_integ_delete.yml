version: 0.2
phases:
  install:
    runtime-versions:
      golang: 1.23
  pre_build:
    commands:
      - echo Deleting integration test infrastructure
      - |
        if [ -z "$BUILD_VERSION" ]; then
          echo "BUILD_VERSION environment variable not provided, defaulting to BUILD_VERSION=2"
          export BUILD_VERSION=2
        else
          echo "BUILD_VERSION is set to: $BUILD_VERSION"
        fi
  build:
    commands:
      - |
        # Validate BUILD_VERSION
        if [ "$BUILD_VERSION" != "2" ] && [ "$BUILD_VERSION" != "3" ]; then
          echo "Unsupported BUILD_VERSION: $BUILD_VERSION"
          echo "Supported versions are: 2, 3"
          exit 1
        fi
      - |
        # Check if publishing is enabled for this BUILD_VERSION
        PUBLISH_ENABLED=$(./scripts/get_linux_version.sh "$BUILD_VERSION" "publish")
        echo "Publish enabled for BUILD_VERSION=${BUILD_VERSION}? ${PUBLISH_ENABLED}"

        if [ "${PUBLISH_ENABLED}" = "false" ]; then
            echo "Publishing is disabled for BUILD_VERSION=${BUILD_VERSION}, skipping infrastructure deletion"
        else
            # Enforce STS regional endpoints
            export AWS_STS_REGIONAL_ENDPOINTS=regional
            
            # Delete infrastructure
            ./integ/integ.sh delete
        fi

artifacts:
  files:
    - '**/*'
