version: 0.2
env:
  shell: bash
  variables:
    THROUGHPUT_LIST: '["20m", "25m", "30m"]'
    CW_THROUGHPUT_LIST: '["1m", "2m", "3m"]'
    PREFIX: 'load-test-fluent-bit-'

phases:
  install:
    runtime-versions:
      golang: 1.23
      python: 3.x
      nodejs: 22
  pre_build:
    commands:
      - echo Creating load test infrastructure
      # upgrade node version
      - npm install -g n
      - n stable
      # install cdk
      - npm config set prefix /usr/local
      - npm install -g aws-cdk
      # install eksctl
      - curl --silent --location "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
      - mv /tmp/eksctl /usr/local/bin
      # install kubectl
      - curl -o kubectl https://amazon-eks.s3.us-west-2.amazonaws.com/1.21.2/2021-07-05/bin/linux/amd64/kubectl
      - chmod +x ./kubectl
      - mkdir -p $HOME/bin && cp ./kubectl $HOME/bin/kubectl && export PATH=$PATH:$HOME/bin
      - echo 'export PATH=$PATH:$HOME/bin' >> ~/.bashrc
      # install aws
      - pip3 uninstall awscli -y
      - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
      - unzip -qq awscliv2.zip
      - ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/bin --update
      - which aws
      - aws --version
      # install aws-iam-authenticator
      - curl -o aws-iam-authenticator https://amazon-eks.s3.us-west-2.amazonaws.com/1.21.2/2021-07-05/bin/linux/amd64/aws-iam-authenticator
      - chmod +x ./aws-iam-authenticator
      - mkdir -p $HOME/bin && cp ./aws-iam-authenticator $HOME/bin/aws-iam-authenticator && export PATH=$PATH:$HOME/bin
      - echo 'export PATH=$PATH:$HOME/bin' >> ~/.bashrc
      # pre-config
      - aws configure set default.region us-west-2
  build:
    commands:
      # Check BUILD_VERSION environment variable and set default if not provided
      - |
        if [ -z "$BUILD_VERSION" ]; then
          echo "BUILD_VERSION environment variable not provided, defaulting to BUILD_VERSION=2"
          export BUILD_VERSION=2
        else
          echo "BUILD_VERSION is set to: $BUILD_VERSION"
        fi
      - |
        # Check if publishing is enabled for this BUILD_VERSION
        PUBLISH_ENABLED=$(./scripts/get_linux_version.sh "$BUILD_VERSION" "publish")
        echo "Publish enabled for BUILD_VERSION=${BUILD_VERSION}? ${PUBLISH_ENABLED}"

        if [ "${PUBLISH_ENABLED}" = "false" ]; then
            echo "Publishing is disabled for BUILD_VERSION=${BUILD_VERSION}, skipping infrastructure creation"
        else
            # Set stack names based on BUILD_VERSION
            if [ "$BUILD_VERSION" = "2" ]; then
              export TESTING_RESOURCES_STACK_NAME='load-test-fluent-bit-testing-resources'
              export LOG_STORAGE_STACK_NAME='load-test-fluent-bit-log-storage'
              export EKS_CLUSTER_NAME='load-test-fluent-bit-eks-cluster'
            else
              export TESTING_RESOURCES_STACK_NAME="load-test-fluent-bit-testing-resources-v${BUILD_VERSION}"
              export LOG_STORAGE_STACK_NAME="load-test-fluent-bit-log-storage-v${BUILD_VERSION}"
              export EKS_CLUSTER_NAME="load-test-fluent-bit-eks-cluster-v${BUILD_VERSION}"
            fi
            echo "Using TESTING_RESOURCES_STACK_NAME: $TESTING_RESOURCES_STACK_NAME"
            echo "Using LOG_STORAGE_STACK_NAME: $LOG_STORAGE_STACK_NAME"
            echo "Using EKS_CLUSTER_NAME: $EKS_CLUSTER_NAME"
            
            # Execute infrastructure creation
            if [ "$BUILD_VERSION" = "2" ] || [ "$BUILD_VERSION" = "3" ]; then
              set -e
              echo "Creating load test infrastructure for AWS for Fluent Bit version $BUILD_VERSION"
              
              # Activate Python virtual environment and install the AWS CDK core dependencies
              python -m venv venv
              source venv/bin/activate
              pip install -r ./load_tests/requirements.txt
              
              # Deploy both CDK stacks
              echo "Deploying Kinesis/Firehose/S3 stack..."
              cdk deploy --require-approval never --app ./load_tests/create_testing_resources/kinesis_s3_firehose
              
              echo "Deploying CloudWatch/${PLATFORM} stack..."
              cdk deploy --require-approval never --app ./load_tests/create_testing_resources/${PLATFORM}
              
              # Set up test environment variables
              source ./load_tests/setup_test_environment.sh
              
              echo "Infrastructure creation completed successfully"
              
            else
              echo "Unsupported BUILD_VERSION: $BUILD_VERSION"
              echo "Supported versions are: 2, 3"
              exit 1
            fi
        fi
artifacts:
  files:
    - '**/*'
